name: Scheduled CI

on:
  schedule: 
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Installing Dependencies
        run: pip install playwright
        

      - name: Execute script
        run: python access.py
