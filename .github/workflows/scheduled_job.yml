name: Scheduled CI

on:
  schedule:
    # Triggers at minute 17 past every 4th hour (00:17, 04:17, 08:17, 12:17, 16:17, 20:17 UTC)
    - cron: '17 */4 * * *'
  # Enables manual execution via the GitHub UI
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute script
        run: python script.py
